name: Publish release container

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: container-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the released version
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Prepare standalone deployment files
        id: release
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 scripts/prepare_release.py "$RELEASE_TAG" "$image" dist
          echo "image=$image" >> "$GITHUB_OUTPUT"
          docker compose -f dist/compose.yaml --env-file dist/.env config --quiet

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: pool-headcount:release-test
          cache-from: type=gha

      - name: Run regression tests in the container
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --workdir /workspace
          pool-headcount:release-test
          python -m pytest -q -p no:cacheprovider

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Publish AMD64 and ARM64 images
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify standalone startup using the published image
        env:
          COMPOSE_PROJECT_NAME: release-smoke
          PORT: '18080'
        run: docker compose -f dist/compose.yaml --env-file dist/.env up -d --wait --wait-timeout 180

      - name: Attach Compose and example environment to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/compose.yaml dist/default.env "dist/ucac-ocr-$RELEASE_TAG.zip" --clobber

      - name: Clean up the smoke-test services and temporary data
        if: always() && steps.publish.outcome == 'success'
        env:
          COMPOSE_PROJECT_NAME: release-smoke
          PORT: '18080'
        run: docker compose -f dist/compose.yaml --env-file dist/.env down --volumes

      - name: Write publication summary
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Published `%s:%s`\n\nDigest: `%s`\n\nDownload `compose.yaml` and `.env` from this release, configure Ollama, then run `docker compose up -d`.\n' \
            "$IMAGE" "${RELEASE_TAG#v}" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
