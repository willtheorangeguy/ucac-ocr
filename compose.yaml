name: ucac-ocr

services:
  web:
    image: ${POOL_HEADCOUNT_IMAGE:-ghcr.io/willtheorangeguy/ucac-ocr:0.1.0}
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pool-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    image: ${POOL_HEADCOUNT_IMAGE:-ghcr.io/willtheorangeguy/ucac-ocr:0.1.0}
    depends_on:
      web:
        condition: service_healthy
    env_file: .env
    environment:
      DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.worker"]
    volumes:
      - pool-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "worker-health"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  pool-data:
